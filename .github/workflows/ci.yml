name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install (not ci) so each runner resolves its own platform-native
        # optional deps (rollup/esbuild binaries); works around npm/cli#4828.
        # legacy-peer-deps: tiptap-markdown peers @tiptap/core ^2 while the app uses ^3.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: npx turbo run lint

      - name: Build
        run: npx turbo run build

      - name: Install Playwright (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Test
        run: npx turbo run test
