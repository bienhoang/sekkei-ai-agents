name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@bienhoang'

      - name: Install dependencies
        # Drop the lockfile so the runner resolves its own platform-native optional
        # deps (rollup/esbuild binaries). A committed lockfile only carries the
        # lock-generating platform's binaries, so npm ci/install on other OSes omit
        # them and rollup fails — this is npm/cli#4828, whose documented workaround is
        # to reinstall without the lockfile.
        # legacy-peer-deps: tiptap-markdown peers @tiptap/core ^2 while the app uses ^3.
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Build
        run: npx turbo run build

      # Direct publish to GitHub Packages. changesets is not used for versioning here
      # (no .changeset/*.md files; versions are bumped manually), and its pre-publish
      # `npm info` check aborts on GitHub Packages' 403-for-unpublished-package
      # behaviour. A direct `npm publish` skips that check; the loop is idempotent so
      # re-runs tolerate versions that are already published.
      - name: Publish to GitHub Packages
        run: |
          set +e
          : > /tmp/published.txt
          for pkg in mcp-server skills preview dashboard; do
            name="@bienhoang/sekkei-$pkg"
            ver=$(node -p "require('./packages/$pkg/package.json').version")
            echo "::group::publish $name@$ver"
            out=$(npm publish -w "$name" --access restricted 2>&1); code=$?
            echo "$out"
            echo "::endgroup::"
            if [ $code -eq 0 ]; then
              echo "$name@$ver" >> /tmp/published.txt
            elif echo "$out" | grep -qiE 'cannot publish over|already exists|409 Conflict'; then
              echo "$name@$ver already published — skipping"
            else
              echo "::error::failed to publish $name@$ver"
              exit $code
            fi
          done
        env:
          # PACKAGES_TOKEN = classic PAT with write:packages. Needed for the FIRST
          # publish of a user-scoped package (@bienhoang/*): the default GITHUB_TOKEN
          # can push new versions to existing repo-linked packages but cannot create a
          # brand-new package under a user account. Falls back to GITHUB_TOKEN when the
          # secret is absent (covers already-existing packages).
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tag published packages
        run: |
          [ -s /tmp/published.txt ] || { echo "nothing newly published"; exit 0; }
          while read -r tag; do
            [ -z "$tag" ] && continue
            if git tag "$tag" 2>/dev/null && git push origin "$tag" 2>/dev/null; then
              echo "tagged $tag"
            else
              echo "tag $tag already exists — skipping"
            fi
          done < /tmp/published.txt
